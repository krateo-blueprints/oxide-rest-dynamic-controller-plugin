name: pinned-uses

# krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by commit
# SHA with a version comment. This repository has no lint workflow, so the shared check gets a workflow of its own.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # krateo-blueprints/charts PUBLISHING.md rule 9: every reusable workflow this repository calls is pinned by
  # commit SHA with a version comment. The shared check refuses any that is not.
  pinned-uses:
    permissions:
      contents: read
    uses: krateo-blueprints/charts/.github/workflows/pinned-uses.yaml@ae27682c30cf6a005e03e77bc18a3f9a194db6ed # 1.4.0
